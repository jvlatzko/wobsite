{{- /* Inline a Font Awesome Free SVG from assets/icons, e.g. partial "icon.html" "github" */ -}}
{{- with resources.Get (printf "icons/%s.svg" .) -}}
	{{- replace .Content "<svg " `<svg class="icon" aria-hidden="true" focusable="false" ` | safeHTML -}}
{{- else -}}
	{{- errorf "icon %q not found in assets/icons" . -}}
{{- end -}}
